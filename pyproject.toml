[project]
name = "dynamics-365-business-central-writer"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "keboola-component>=1.11.0",
    "keboola-http-client>=1.0.1",
    "keboola-utils>=1.1.0",
    "pydantic>=2.11.3",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "keboola-datadirtest>=2.1.0",
    "mock>=5.2.0",
    "pytest>=9.0.2",
    "ruff>=0.11.5",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
